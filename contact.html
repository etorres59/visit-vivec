    <main>
        <div class="form-header">
            <h1>Contact Us</h1>
            <div class="contact-img">
                <img src="images/Courier19.jpg"
                    class="courier-img" alt="A courier NPC from Morrowind." />
            </div>
            <div class="citation">
                <p class="image-citation contact-citation">
                    Credit:
                    <a href="https://elderscrolls.fandom.com/wiki/Courier_(Skyrim)" target="_blank" rel="noopener">
                        elderscrolls.fandom.com, by The Rim of the Sky
                    </a>
                </p>
            </div>
            <p>Fill out the form below. One of our agents will contact you!</p>
        </div>

        <div class="elder-scrolls-form-wrapper">
            <form id="contact-form" novalidate>
                <div class="form-piece">
                    <label for="form-name">Name:</label>
                    <input type="text" id="form-name" name="form-name">
                    <span class="error" id="name-error"></span>
                </div>

                <div class="form-piece">
                    <label for="form-email">Email:</label>
                    <input type="email" id="form-email" name="form-email">
                    <span class="error" id="email-error"></span>
                </div>

                <div class="form-piece">
                    <label for="form-message">Message:</label>
                    <textarea id="form-message" name="form-message"></textarea>
                    <span class="error" id="message-error"></span>
                </div>

                <div class="form-piece">
                    <label for="date">Trip Start Date:</label>
                    <p id="date"><input type="text" id="datepicker"></p>
                    <span class="error" id="message-error"></span>
                </div>

                <div class="form-piece">
                    <input class="button submit" type="submit" value="Submit">
                </div>
            </form>
        </div>
    </main>
